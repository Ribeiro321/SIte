        html, body {

        body {
    margin: 0;

}

body::before {
    content: "";

        /* Cabeçalho */
        .cabecalho {
            width: 100%;
            height: 100px;
            background-color: #fbacfb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cabecalho h1 {
            color: rgb(248, 94, 189);
            font-size: 45px;
            margin: 0;
            font-weight: bold;
        }

        /* Área principal */
        .principal {
            min-height: calc(100vh - 100px);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            padding: 50px;
            box-sizing: border-box;
        }

        /* Texto */
        .texto {
            font-size: 65px;
            color: #ffffff;
            line-height: 1.2;
            margin: 0;
            font-weight: 500;
        }

        /* Foto */
        .foto {
            width: 400px;
            height: 400px;
            object-fit: cover;
            border: 10px solid rgb(248, 94, 189);
            border-radius: 50%;
        }

        /* Botão */
        .botao {
            display: inline-block;
            margin-top: 50px;
            padding: 18px 45px;
            background-color: #fbacfb;
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 15px;
            border: 3px solid rgb(248, 94, 189);
            transition: 0.3s;
        }

        .botao:hover {
            background-color: rgb(248, 94, 189);
            color: white;
        }

        /* Ajuste para telas menores */
        @media (max-width: 900px) {

            .principal {
                flex-direction: column;
                gap: 30px;
                text-align: center;
            }

            .texto {
                font-size: 45px;
            }

            .foto {
                width: 280px;
                height: 280px;
            }

            .cabecalho h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
